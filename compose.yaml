services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pg}
      POSTGRES_DB: courses
    volumes:
      - pgdata:/var/lib/postgresql/data
      # бэкап восстанавливается один раз при первой инициализации тома
      - ./docker/restore.sh:/docker-entrypoint-initdb.d/10-restore.sh:ro
      - ${BACKUP_FILE:-./data/alfa_course_hackathon.backup}:/backup/course.backup:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d courses"]
      interval: 5s
      retries: 30

  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-pg}@db:5432/courses
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
